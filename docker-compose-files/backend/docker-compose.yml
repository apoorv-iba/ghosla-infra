version: '3.8'

services:
  mariadb-master:
    # Using 11.4 because it is the current Long Term Support (LTS) release
    image: mariadb:11.4
    container_name: mariadb-master
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-default_db}
      MARIADB_USER: ${MARIADB_USER:-default_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-default_password}
    volumes:
      - mariadb_master_data:/var/lib/mysql
    networks:
      - backend-nw

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "11001:8080"
    environment:
      # Quality of Life: This auto-fills the "Server" box on the login screen!
      ADMINER_DEFAULT_SERVER: mariadb-standalone
    networks:
      - backend-nw
      - rproxy-nw

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    container_name: meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - backend-nw

  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      TOKEN: ${BROWSERLESS_TOKEN}
      CONCURRENT: "10"
      QUEUED: "10"
      TIMEOUT: "300000"
    shm_size: "2g"
    networks:
      - backend-nw

volumes:
  mariadb_master_data:
  meilisearch_data:

networks:
  backend-nw:
    external: true
  rproxy-nw:
    external: true
